name: Validate static site
on:
  pull_request:
  push:
    branches:
      - main
      - commercial-platform-suite
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check business-suite.js
          node --check config.js
          node --check lms.js
          node --check homework.js
          node --check notifications.js
          node --check netlify/functions/send-notification.js
          node --check public-feed.js
          node --check netlify/functions/payhere-checkout.js
          node --check netlify/functions/payhere-notify.js
          node --check language.js
          node --check certificates.js
          node --check admin-tools.js
          node --check pwa.js
          node --check portal-accounts.js
          node --check id-cards.js
      - name: Check required deployment files
        run: |
          test -s index.html
          test -s style.css
          test -s supabase-schema.sql
          test -s 002_commercial_suite.sql
          test -s 003_workflows_security.sql
          test -s 004_payhere_payments.sql
          test -s 005_homework_uploads.sql
          test -s 006_notifications.sql
          test -s 007_multi_admin.sql
          test -s 008_certificate_access.sql
          test -s 009_portal_account_linking.sql
          test -s _headers
          test -s robots.txt
          test -s sitemap.xml
          test -s portal-accounts.js
          test -s id-cards.js
          test -s certificates.js
          test -s admin-tools.js
          test -s sw.js
          test -s manifest.webmanifest
          test -s icon.svg
          test -s notifications.js
          test -s netlify/functions/send-notification.js
          test -s netlify/functions/payhere-checkout.js
          test -s netlify/functions/payhere-notify.js
