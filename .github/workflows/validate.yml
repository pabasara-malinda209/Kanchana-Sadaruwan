name: Validate static site
on:
  pull_request:
  push:
    branches:
      - main
      - commercial-platform-suite
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check business-suite.js
          node --check config.js
      - name: Check required deployment files
        run: |
          test -s index.html
          test -s style.css
          test -s supabase-schema.sql
          test -s 002_commercial_suite.sql
